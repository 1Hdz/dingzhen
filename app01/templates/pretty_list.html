{% extends 'layout.html' %}

{% block content %}
<div style="margin-bottom: 10px;">
    <a href="/pretty/add/" class="btn btn-success">
        <span class="glyphicon glyphicon-plus"></span> 新建靓号
    </a>
    <form class="form-inline pull-right" method="get">
        <div class="form-group">
            <input type="text" class="form-control" name="q" placeholder="搜索号码" value="{{ q }}">
        </div>
        <button type="submit" class="btn btn-primary">搜索</button>
    </form>
</div>

<div class="panel panel-default">
    <div class="panel-heading">靓号列表</div>
    <table class="table table-bordered table-striped">
        <thead>
            <tr>
                <th>ID</th>
                <th>号码</th>
                <th>价格</th>
                <th>级别</th>
                <th>状态</th>
                <th>操作</th>
            </tr>
        </thead>
        <tbody>
            {% for obj in queryset %}
            <tr>
                <td>{{ obj.id }}</td>
                <td>{{ obj.mobile }}</td>
                <td>{{ obj.price }}</td>
                <td>{{ obj.get_level_display }}</td>
                <td>{{ obj.get_status_display }}</td>
                <td>
                    <a href="/pretty/{{ obj.id }}/edit/" class="btn btn-primary btn-xs">编辑</a>
                    <a href="/pretty/{{ obj.id }}/delete/" class="btn btn-danger btn-xs"
                       onclick="return confirm('确定删除？')">删除</a>
                </td>
            </tr>
            {% endfor %}
        </tbody>
    </table>
    <div style="text-align: center;">
        {{ page_html }}
    </div>
</div>
{% endblock %}
